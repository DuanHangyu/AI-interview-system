<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.svg" type="image/svg+xml" />
    <title>AI 面试评估</title>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f7;
      }
      .boot i {
        width: 28px;
        height: 28px;
        border: 3px solid #dbe5ff;
        border-top-color: #3370ff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>请启用 JavaScript 后访问本系统。</noscript>
    <div id="app"><div class="boot"><i></i></div></div>
  </body>
</html>
