# 单机部署：MySQL + Redis + 后端 + Nginx（前端静态文件 + API 反向代理）
# 用法：cp .env.example .env && 修改密码/密钥 && docker compose up -d
# 横向扩容：backend 可以起多个副本（任务队列、登录态都已支持多实例），文件存储需改为 OSS 或共享目录
name: ai-interview

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ai-interview-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: defense
      MYSQL_USER: defense
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=1000
      - --innodb-buffer-pool-size=512M
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../scripts/local-db-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../scripts/local-db-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: ai-interview-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: ${JRE_IMAGE:-eclipse-temurin:21-jre}
    container_name: ai-interview-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=70", "-XX:+ExitOnOutOfMemoryError", "-jar", "/app/app.jar"]
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILE: local
      DB_JDBC_URL: jdbc:mysql://mysql:3306/defense?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      DB_USERNAME: defense
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JETCACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      TASK_WORKER_TYPES: ${TASK_WORKER_TYPES:-}
      # 后台任务并发与百炼调用上限，按账号配额调整（见 docs/ARCHITECTURE.md）
      TASK_CONCURRENCY_ASR: ${TASK_CONCURRENCY_ASR:-3}
      TASK_CONCURRENCY_ANALYSIS: ${TASK_CONCURRENCY_ANALYSIS:-4}
      DASHSCOPE_CONCURRENCY_ASR: ${DASHSCOPE_CONCURRENCY_ASR:-10}
      DASHSCOPE_CONCURRENCY_LLM: ${DASHSCOPE_CONCURRENCY_LLM:-6}
      STORAGE_TYPE: ${STORAGE_TYPE:-auto}
      STORAGE_LOCAL_DIR: /data/storage
      STORAGE_PUBLIC_URL_PREFIX: /api
      STORAGE_LOCAL_SECRET: ${STORAGE_LOCAL_SECRET}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
    volumes:
      - ./app/app.jar:/app/app.jar:ro
      - ./data/storage:/data/storage
      - ./data/logs:/app/logs
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY:-3g}

  web:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: ai-interview-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-18100}:80"
    volumes:
      - ./app/web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
